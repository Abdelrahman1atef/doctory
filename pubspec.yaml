name: doctory
description: "A new Flutter project for Doctory."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  dio: ^5.8.0+1
  cached_network_image: ^3.2.3
  shimmer: ^3.0.0
  flutter_svg: ^2.0.7
  smooth_page_indicator: ^2.0.1
  bloc: ^8.1.2
  flutter_bloc: ^8.1.3
  carousel_slider: ^4.2.1
  animated_widgets_flutter: ^1.1.1+2
  get_it: ^7.6.0
  lottie: ^2.0.1
  responsive_framework: ^1.5.1
  fluttertoast: ^8.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_smart_dialog: ^4.9.8+9
  bot_toast: ^4.1.3
  pretty_dio_logger: ^1.4.0
  permission_handler: ^12.0.1
  image_picker: ^1.1.2
  device_info_plus: ^11.5.0
  dotted_border: ^3.1.0
  pinput: ^5.0.1
  animate_do: ^3.3.2
  chewie: ^1.12.1
  flutter_secure_storage: ^9.2.4
  video_player: ^2.10.0
  file_picker: ^10.2.0
  firebase_remote_config: ^5.5.0
  flutter_widget_from_html: ^0.15.1
  share_plus: ^10.1.4
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1

  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_maps_flutter: ^2.12.3
  google_maps_flutter_android: ^2.14.3
  infinite_scroll_pagination: ^4.1.0
  shared_preferences: ^2.5.4
  go_router: ^17.1.0
  easy_localization: ^3.0.8
  another_flushbar: ^1.12.32
  dartz: ^0.10.1
  pusher_channels_flutter: ^2.4.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^20.1.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  internet_connection_checker_plus: ^2.9.1+2
  mocktail: ^1.0.4
  bloc_test: ^9.1.7
  flutter_slidable: ^4.0.3
  equatable: ^2.0.8
  record: ^6.2.0
  audioplayers: ^6.6.0
  path_provider: ^2.1.5
  firebase_core: ^3.15.2
  collection: ^1.18.0
  path: ^1.9.1
  mobile_scanner: ^7.2.0
  pin_code_fields:
  firebase_analytics: ^11.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.5.0
  build_runner: ^2.7.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0 # Added for native splash screen

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translation/
    - assets/icons/
    - assets/fonts/
    - assets/json/
    - assets/lottie/

  fonts:
    - family: Bukra
      fonts:
        - asset: assets/fonts/Bukra-Regular.ttf
        - asset: assets/fonts/Bukra-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "assets/images/app_logo.png"
  android: true # can specify file name here e.g. "ic_launcher"
  ios: true # can specify file name here e.g. "My-Launcher-Icon"
  adaptive_icon_background: "assets/images/christmas-background.png" # only available for Android 8.0 devices and above
  adaptive_icon_foreground: "assets/images/icon-foreground-432x432.png" # only available for Android 8.0 devices and above
  adaptive_icon_foreground_inset: 16 # only available for Android 8.0 devices and above
  adaptive_icon_monochrome: "assets/images/icon-monochrome-432x432.png" # only available for Android 13 devices and above
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true
  background_color_ios: "#ffffff"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/app_logo.png
  android: true
  ios: true
  web: false # Assuming not needed for web, can be changed if required


















